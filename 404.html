<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>页面不存在 — lizeming.net</title>
    <link rel="icon" type="image/svg+xml" href="/assets/seal.svg">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #FAFAF8; color: #1C1C1C; font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; line-height: 1.8; }
        .box { max-width: 520px; margin: 18vh auto 0; padding: 0 24px; }
        .seal { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 6px; background: #A8432F; color: #FBF7F2; font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 1.3rem; transform: rotate(-5deg); position: relative; }
        .seal::after { content: ""; position: absolute; inset: 3px; border: 1px solid #FBF7F2; border-radius: 4px; opacity: .55; }
        h1 { font-family: 'Noto Serif SC', serif; font-size: 1.6rem; margin: 22px 0 8px; }
        p { color: #5A5A58; font-size: .95rem; margin: 0 0 6px; }
        a { color: #2B5B4B; }
    </style>
</head>
<body>
<div class="box">
    <span class="seal" aria-hidden="true">李</span>
    <h1>这一页走丢了</h1>
    <p>链接可能写错了，或者这一页已经下线（比如原来的学英语板块）。</p>
    <p>所有投资内容都能从 <a href="/">首页</a> 找到。</p>
</div>
</body>
</html>
